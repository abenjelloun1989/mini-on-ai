<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Paper Voyage: Boats</title>
<meta name="robots" content="noindex, nofollow">
<style>
  @font-face { font-family: "Nunito"; src: url(assets/nunito.woff2) format("woff2"); font-weight: 200 1000; font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url(assets/cormorant.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Cormorant"; src: url(assets/cormorant-italique.woff2) format("woff2"); font-style: italic; font-display: swap; }
  @font-face { font-family: "Caveat Brush"; src: url(assets/caveat-brush.woff2) format("woff2"); font-display: swap; }
  :root {
    --encre: #2e3a4f;
    --reserve: #fffdf6;
    --carnet: #f7f1e3;
    --eau: #3e8ba8;
    --soleil: #f6c945;
    --voile: rgba(46, 58, 79, .5);

  }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a7c77a; }
  body {

    color: var(--encre);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #jeu { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #hud {

  #hud .barre { flex: 1; min-width: 0; gap: 8px; padding: 0 9px; border-radius: 9px 13px 8px 12px; }
  #hud .piste { flex: 1; height: 8px; box-sizing: border-box; border-radius: 4px; border: 1.2px solid var(--encre); background: var(--carnet); position: relative; }
  #hud .piste i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--eau); }
  #hud .piste b { position: absolute; left: 0; top: -6px; width: 16px; height: 16px; margin-left: -8px; box-sizing: border-box; border-radius: 8px; background: var(--reserve); border: 1.5px solid var(--encre); }
  #hud .fleurs { padding: 0 10px 0 6px; gap: 4px; font-size: 19px; font-weight: 900; line-height: 1; border-radius: 12px 8px 12px 10px; }
  #hud .fleurs b { font-variant-numeric: tabular-nums; }

  .voile {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    padding: 24px; text-align: center;
  }

  .carte {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: min(100%, 320px); box-sizing: border-box; padding: 26px 22px 24px;
    background: var(--carnet); border: 2px solid var(--encre);
    border-radius: 20px 15px 22px 14px; box-shadow: 4px 5px 0 var(--encre);
  }
  .carte h1 { margin: 0; font-family: "Caveat Brush", cursive; font-weight: 400; font-size: 44px; line-height: 1.05; }
  .carte p { margin: 0; font-size: 17px; line-height: 1.35; }
  #pret { pointer-events: none; justify-content: space-between; padding: calc(env(safe-area-inset-top, 0px) + 84px) 24px 5vh; }
  #pret img { width: min(78vw, 310px); height: auto; display: block; }
  #pret #pretPortrait img { width: 104px; margin: 0 auto 4px; }
  #finWindy img { display: block; width: 86px; height: 86px; margin-bottom: -10px; }
  #finPage img { width: 52px; height: 52px; flex: none; }
  .livre-tete { display: flex; justify-content: center; }

  #pret p {

  #pret p b { display: block; font-family: "Caveat Brush", cursive; font-weight: 400; font-size: 26px; line-height: 1.1; }
  .boutons { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; width: 100%; }
  button {

    border: 2px solid var(--encre); border-radius: 16px 12px 17px 11px;
    background: var(--eau); box-shadow: 3px 4px 0 var(--encre);
  }
  button:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--encre); }

  button.video { background: var(--soleil); color: var(--encre); font-size: 17px; border-radius: 12px 16px 11px 17px; }
  button.discret { background: transparent; color: var(--encre); box-shadow: none; min-height: 44px; font-size: 16px; font-weight: 800; border: 1.5px dashed var(--encre); border-radius: 12px; }
  #btnSon, #btnPause {
    flex: none; width: 44px; min-height: 44px; height: 44px; padding: 0; pointer-events: auto; position: relative;
    background: var(--reserve); color: var(--encre); border-width: 1.5px; border-radius: 14px 11px 15px 10px; box-shadow: var(--ombre);

  .carte h2 { margin: 6px 0 -2px; align-self: flex-start; font-family: "Caveat Brush", cursive; font-weight: 400; font-size: 26px; }
  .progres { width: 100%; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
  .progres .piste { height: 12px; box-sizing: border-box; border-radius: 6px; border: 1.5px solid var(--encre); background: var(--reserve); overflow: hidden; }
  .progres i { display: block; height: 100%; width: 0; background: #e8578e; transition: width .7s ease-out; }
  .nouveau { width: 100%; box-sizing: border-box; padding: 8px 10px; display: flex; align-items: center; gap: 10px; text-align: left; font-size: 15px; line-height: 1.25; background: var(--soleil); border: 1.5px solid var(--encre); border-radius: 12px 9px 13px 8px; }
  .nouveau canvas { width: 56px; height: 56px; flex: none; }
  .nouveau button { margin-left: auto; min-height: 44px; padding: 0 12px; font-size: 15px; box-shadow: none; white-space: nowrap; }
  .carte.large .boutons { position: sticky; bottom: -24px; padding-block: 8px; background: var(--carnet); }
  #pret button { pointer-events: auto; min-height: 44px; font-size: 16px; background: var(--reserve); color: var(--encre); margin-top: 12px; box-shadow: var(--ombre); border-width: 1.5px; }
  #carnet { touch-action: pan-y; }
  .profil { width: 100%; display: flex; flex-direction: column; gap: 4px; text-align: left; font-size: 14px; }
  .profil input {

    background: var(--reserve); border: 1.5px solid var(--encre); border-radius: 12px 9px 13px 8px;
    -webkit-user-select: text; user-select: text;
  }

  .chiffres span { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 800; line-height: 1.2; text-align: center; }
  .chiffres b { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .carte.large { width: min(100%, 440px); max-height: 100%; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .grille { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .bateau, .canal {
    min-height: 44px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 13px; font-weight: 800; line-height: 1.15; color: var(--encre);
    background: var(--reserve); border: 1.5px solid var(--encre); border-radius: 12px 9px 13px 8px; box-shadow: none;
  }
  .bateau.choisi { background: var(--soleil); box-shadow: 2px 3px 0 var(--encre); }
  .bateau[disabled] canvas { filter: brightness(0) opacity(.22); }
  .bateau[disabled], .canal[disabled] { cursor: default; border-style: dashed; background: transparent; color: #4c5d7a; }
  .canal b { font-size: 19px; font-weight: 900; }
  .canal span { font-size: 13px; letter-spacing: 1px; color: #b98a12; -webkit-text-stroke: .5px var(--encre); }
  #hCombo { font-size: 14px; color: #c13a72; }
  #voileLent { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; background: radial-gradient(circle at center, rgba(124, 192, 208, .08) 45%, rgba(62, 139, 168, .42) 100%); }
  #voileLent.actif { opacity: 1; }
  #hSous {
    z-index: 8; position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 62px);
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  }
  #hChrono { font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #hChrono.gele { color: #2f7591; }
  #toast { max-width: 80vw; height: auto; padding: 4px 12px; font-size: 15px; text-align: center; background: var(--soleil); }
  .temps { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .temps canvas { width: 34px; height: 38px; }
  .canal small { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 3px; min-height: 16px; }
  .canal canvas { width: 14px; height: 16px; }
  .duo { display: flex; gap: 10px; }
  .duo button { flex: 1; min-width: 0; padding: 0 6px; }
  #pret .duo { margin-top: 12px; pointer-events: auto; }
  #pret .duo button { margin-top: 0; }
  .pellicule { font-size: 20px; line-height: 1; }

  /* Shop and pre-run screens */
  .ecran {
    z-index: 6; position: fixed; inset: 0; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
    background: var(--carnet); display: flex; flex-direction: column; align-items: center;
  }
  .page {
    width: min(100%, 440px); box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 22px;
  }
  .tete { display: flex; align-items: center; gap: 10px; }
  .tete h1 { margin: 0; flex: 1; font-family: "Caveat Brush", cursive; font-weight: 400; font-size: 40px; line-height: 1; }
  .retour { width: 44px; min-height: 44px; padding: 0; background: var(--reserve); color: var(--encre); border-width: 1.5px; box-shadow: var(--ombre); font-size: 22px; }
  .solde { height: 44px; padding: 0 12px; gap: 6px; font-size: 21px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .onglets { display: flex; gap: 6px; }
  .onglets button {
    flex: 1; min-height: 44px; padding: 0; font-size: 16px; color: var(--encre); background: #eadfc8;
    border-width: 1.5px; border-radius: 12px 12px 5px 5px; box-shadow: none;
  }
  .onglets button.actif { background: var(--reserve); box-shadow: inset 0 -4px 0 #2f7591; }
  .fiches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .fiche {
    display: flex; flex-direction: column; gap: 3px; padding: 8px; box-sizing: border-box;
    background: var(--reserve); border: 1.5px solid var(--encre); border-radius: 14px 10px 15px 9px; box-shadow: 2px 3px 0 rgba(46,58,79,.15);
  }
  .fiche.legendaire { background: #fff0bf; border: 2px solid #c99a2e; }
  .fiche.epique { background: #f1ebff; border-color: #6a4fb3; }
  .fiche.rare { background: #eaf5f8; }
  .fiche .epoque { font-size: 12px; font-weight: 800; color: #4c5d7a; }
  .rarete { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 900; margin-top: 4px; }
  .rarete canvas { width: 22px; height: 22px; }
  .monde { display: flex; flex-direction: column; gap: 8px; padding: 10px; box-sizing: border-box; background: var(--reserve); border: 1.5px solid var(--encre); border-radius: 14px 10px 15px 9px; box-shadow: 2px 3px 0 rgba(46,58,79,.15); }
  .monde.ferme { opacity: .6; background: #eadfc8; }
  .monde > button { all: unset; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
  .monde canvas.vue { display: block; width: 100%; height: auto; border-radius: 6px; border: 1.5px solid var(--encre); box-sizing: border-box; }
  .monde.ferme canvas.vue { filter: grayscale(.85) brightness(.9); }
  .monde .titre { display: flex; flex-direction: column; gap: 2px; font-size: 13px; font-weight: 800; color: #4c5d7a; }
  .monde .titre b { font-family: "Caveat Brush", cursive; font-weight: 400; font-size: 25px; line-height: 1; color: var(--encre); }
  .tampons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .tampons button { min-height: 64px; padding: 2px; background: var(--reserve); border-width: 1.5px; box-shadow: none; border-radius: 12px 9px 13px 8px; }
  .tampons button.choisi { background: var(--soleil); }
  .tampons canvas { width: 52px; height: 52px; }
  .retour canvas { width: 40px; height: 40px; }
  .fiche.profilBateau { flex-direction: row; align-items: center; gap: 10px; }
  .profilBateau canvas { width: 64px; height: 64px; }
  .profilBateau div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .profilBateau button { min-height: 44px; font-size: 15px; padding: 0 12px; background: var(--reserve); color: var(--encre); border-width: 1.5px; box-shadow: none; }
  #recit { z-index: 7; position: fixed; inset: 0; background: #0c1118; overflow: hidden; display: flex; justify-content: center; }
  #recit .cadre { position: relative; width: min(100%, 46.2vh); height: 100%; overflow: hidden; }
  #recitImage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; animation: fondu 1.1s ease-out; }
  #recitImage.objet { inset: 12% 10% auto; width: 80%; height: 42%; object-fit: contain; object-position: center; }
  @keyframes fondu { from { opacity: 0; transform: scale(1.03); } }
  /* On wide screens the picture's own dark foot is cropped, so the text brings its shade along. */
  #recitOmbre { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; pointer-events: none; background: linear-gradient(to bottom, rgba(10, 14, 20, 0), rgba(10, 14, 20, .85) 38%, rgba(10, 14, 20, .96) 100%); }
  #recitTexte { text-shadow: 0 1px 8px rgba(5, 8, 12, .9); position: absolute; left: 22px; right: 22px; bottom: 88px; margin: 0; font-family: "Cormorant", Georgia, serif; font-style: italic; font-weight: 500; font-size: 23px; line-height: 1.28; color: #f2ebdd; text-align: center; animation: fondu 1.2s .25s ease-out backwards; }
  #recitBarre { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; gap: 8px; align-items: center; z-index: 2; }
  #recitBarre select { flex: 1; min-width: 0; min-height: 44px; font: inherit; font-size: 15px; color: #f2ebdd; background: rgba(12, 17, 24, .85); border: 1px solid rgba(242, 235, 221, .45); border-radius: 3px; padding: 0 8px; }
  #recitBarre span { color: #f2ebdd; font-size: 13px; white-space: nowrap; }
  #recitBarre button { min-height: 44px; width: 44px; padding: 0; font-size: 18px; color: #f2ebdd; background: rgba(12, 17, 24, .85); border: 1px solid rgba(242, 235, 221, .45); box-shadow: none; }
  #recit canvas#recitImage { inset: 12% 15% auto; width: 70%; height: auto; }
  #recit .suite { position: absolute; left: 20px; right: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }
  #recit .suite button { min-height: 48px; font-family: "Cormorant", Georgia, serif; font-size: 20px; font-weight: 500; color: #f2ebdd; background: transparent; border: 1px solid rgba(242, 235, 221, .45); border-radius: 3px; box-shadow: none; }
  #recit .suite button#recitPasser { border-color: transparent; color: rgba(242, 235, 221, .8); }
  #recit.lecture .suite button { font-size: 30px; line-height: 1; border-color: rgba(242, 235, 221, .45); }
  @media (prefers-reduced-motion: reduce) { #recitImage, #recitTexte { animation: none; } }
  .suite { display: flex; gap: 10px; }
  .suite button { flex: 1; }
  .page-livre { display: flex; flex-direction: column; gap: 12px; padding: 16px 14px; background: #e6d9ba; border: 1px solid #8a7350; border-radius: 2px; font-family: "Cormorant", Georgia, serif; color: #2a1e14; }
  .page-livre.perdue { opacity: .55; background: #d8cdb4; border-style: dashed; }
  .page-livre h2 { margin: 0; padding-bottom: 6px; border-bottom: 1px solid #8a7350; font-family: inherit; font-weight: 500; font-size: 25px; }
  .page-livre article b { font-size: 20px; font-weight: 500; }
  .page-livre article small { font-size: 15px; font-style: italic; color: #5a4a36; margin-left: 6px; }
  .page-livre article { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 8px; }
  .page-livre article canvas { grid-row: 1 / 3; width: 64px; height: 64px; }
  .page-livre article p { margin: 2px 0 0; font-size: 17px; line-height: 1.3; }
  #pliage { z-index: 9; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgba(21, 28, 41, .96); }
  .plieuse { position: relative; width: 210px; height: 210px; perspective: 700px; animation: tourne .5s 1.25s ease-in forwards; }
  .plieuse b, .plieuse i { position: absolute; inset: 0; background: var(--papier, #efe6d2); }
  .plieuse b { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); box-shadow: inset 0 0 40px rgba(46, 58, 79, .18); }
  .plieuse i { backface-visibility: visible; filter: drop-shadow(0 2px 3px rgba(21, 28, 41, .4)); animation: .32s ease-in-out forwards; }
  .plieuse i:nth-child(2) { clip-path: polygon(0 0, 50% 0, 0 50%); transform-origin: 25% 25%; animation-name: plia; animation-delay: .1s; }
  .plieuse i:nth-child(3) { clip-path: polygon(100% 0, 100% 50%, 50% 0); transform-origin: 75% 25%; animation-name: plib; animation-delay: .4s; }
  .plieuse i:nth-child(4) { clip-path: polygon(100% 100%, 50% 100%, 100% 50%); transform-origin: 75% 75%; animation-name: plia; animation-delay: .7s; }
  .plieuse i:nth-child(5) { clip-path: polygon(0 100%, 0 50%, 50% 100%); transform-origin: 25% 75%; animation-name: plib; animation-delay: 1s; }
  @keyframes plia { to { transform: rotate3d(1, -1, 0, 180deg); background: color-mix(in srgb, var(--papier, #efe6d2) 82%, #2e3a4f); } }
  @keyframes plib { to { transform: rotate3d(1, 1, 0, 180deg); background: color-mix(in srgb, var(--papier, #efe6d2) 82%, #2e3a4f); } }
  @keyframes tourne { to { transform: rotate(540deg) scale(.08); opacity: 0; } }
  .eclair { position: absolute; inset: 0; background: #fffdf6; opacity: 0; animation: eclair .5s 1.7s ease-out; pointer-events: none; }
  @keyframes eclair { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
  .revele { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; color: #fffdf6; text-align: center; opacity: 0; animation: apparait .3s 1.75s forwards; }
  @keyframes apparait { to { opacity: 1; } }
  .rayons { position: absolute; left: 50%; top: 36%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax; background: repeating-conic-gradient(var(--lueur, #fff) 0 9deg, transparent 9deg 24deg); opacity: .22; -webkit-mask-image: radial-gradient(closest-side, #000 8%, transparent 62%); mask-image: radial-gradient(closest-side, #000 8%, transparent 62%); animation: rayons 16s linear infinite; }
  @keyframes rayons { to { transform: rotate(360deg); } }
  .revele canvas.bateau-vu { position: relative; width: 250px; height: 250px; animation: jaillit .6s 1.75s cubic-bezier(.2, 1.7, .4, 1) backwards; filter: drop-shadow(0 0 22px var(--lueur, #fff)); }
  @keyframes jaillit { from { transform: scale(.2) rotate(-16deg); } }
  .revele canvas.tampon { position: relative; width: 58px; height: 58px; animation: tampon .4s 2.2s ease-out backwards; }
  .revele h2 { position: relative; margin: 0; font-family: "Caveat Brush", cursive; font-weight: 400; font-size: 42px; line-height: 1; }
  .revele span { position: relative; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--lueur, #fff); }
  .revele p { position: relative; margin: 0; max-width: 34ch; font-size: 16px; line-height: 1.4; font-weight: 700; }
  .revele button { position: relative; margin-top: 8px; min-width: 200px; }
  .fin-soin { display: flex; gap: 8px; }

// Everything is synthesised: no audio files to load.
const son = {
  ctx: null, master: null, bruit: null, muet: store.get('muet', false), coupe: false,

  // Browsers only start audio from a user gesture.
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain();
    this.master.connect(c.destination);
    this.volume();
    this.bruit = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
    const d = this.bruit.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // The water, always there and very quiet
    const eau = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    eau.buffer = this.bruit; eau.loop = true;
    f.type = 'lowpass'; f.frequency.value = 420;
    g.gain.value = 0.05;
    eau.connect(f).connect(g).connect(this.master);
    eau.start();
  },
  volume() { if (this.master) this.master.gain.value = this.muet || this.coupe ? 0 : 0.9; },
  basculer() { this.muet = !this.muet; store.set('muet', this.muet); this.volume(); },
  // Silent during ad breaks
  pause(oui) { this.coupe = oui; this.volume(); },

  souffle(type, de, a, duree, gain, q = 1) {
    if (!this.ctx) return;
    const c = this.ctx, t0 = c.currentTime;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.bruit;
    f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(de, t0);
    f.frequency.exponentialRampToValueAtTime(a, t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + duree * 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    s.connect(f).connect(g).connect(this.master);
    s.start(t0, Math.random() * 1.5, duree + 0.05);
  },
  note(freq, retard, duree, gain, type = 'sine', vers = freq) {
    if (!this.ctx) return;
    const c = this.ctx, t0 = c.currentTime + retard;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(vers, t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    o.connect(g).connect(this.master);
    o.start(t0);
    o.stop(t0 + duree + 0.02);
  },

  rafale(force) {
    const v = 0.9 + Math.random() * 0.25;
    this.souffle('bandpass', 420 * v, 1500 * v, 0.34, 0.22 + 0.28 * force, 0.8);
  },
  choc() {
    this.note(190, 0, 0.26, 0.5, 'sine', 62);
    this.souffle('lowpass', 1400, 260, 0.24, 0.45);
  },
  // Flowers climb a pentatonic scale, so a run of them makes a little tune
  bonus() {
    [523, 784, 1047].forEach((f, i) => this.note(f, i * 0.07, 0.24, 0.16, 'triangle'));
  },
  fleur(n) {
    const gamme = [659, 784, 880, 988, 1175, 1319];
    const f = gamme[(n - 1) % gamme.length];
    this.note(f, 0, 0.22, 0.2, 'triangle');
    this.note(f * 2, 0.04, 0.16, 0.06);
  },
  port() { [523, 659, 784, 1047].forEach((f, i) => this.note(f, i * 0.12, 0.5, 0.2, 'triangle')); },
  coule() {
    this.note(330, 0, 0.7, 0.3, 'sine', 90);
    [0.2, 0.34, 0.5].forEach(r => this.note(240 + Math.random() * 180, r, 0.1, 0.12, 'sine', 520));
  },
};

// The world is 360 units wide; the playfield is a portrait column centred on screen.
const W = 360;
const cv = document.getElementById('jeu');
const ctx = cv.getContext('2d');
let dpr = 1, scale = 1, offX = 0, viewH = 640, cssW = 360;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = innerWidth;
  const h = innerHeight;
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(h * dpr);

}

const anchor = () => viewH * 0.72;          // boat sits low on screen to show what's ahead
let camY = 0;
const Y = y => anchor() - (y - camY);       // world y (grows downstream) -> screen units

// ---------- Levels ----------
function makeLevel(n) {
  const rnd = mulberry32(n * 7919 + 13);
  // First canals are short so a new player gets three wins in about a minute.
  const speed = 62 + Math.min(n, 10) * 4;
  // Each world opens with a breather and ends on its hardest canal.
  const detente = n > 1 && n % 5 === 1, finale = n % 5 === 0;
  const len = speed * Math.min(20 + (n - 1) * 3, 55) * (finale ? 1.15 : 1);
  const base = Math.max(92, 128 - n * 3);
  const amp = Math.min(30 + n * 6, 168 - base);
  const f1 = 380 + rnd() * 220, p1 = rnd() * 6.28;
  const f2 = 150 + rnd() * 80, p2 = rnd() * 6.28;
  const lisse = u => u * u * (3 - 2 * u);
  const ramp = y => lisse(clamp((y - 150) / 450, 0, 1)) * lisse(clamp((len - y) / 300, 0, 1));
  const center = y => W / 2 + amp * ramp(y) * (0.75 * Math.sin(y / f1 + p1) + 0.25 * Math.sin(y / f2 + p2));
  const half = y => base + 16 * Math.sin(y / 230 + p2 * 2) + 40 * (1 - ramp(y));

  const rocks = [], whirls = [], ducks = [], flowers = [], objets = [];
  const free = (x, y, r) => rocks.every(o => Math.hypot(o.x - x, o.y - y) > o.r + r)
    && whirls.every(o => Math.hypot(o.x - x, o.y - y) > o.r * 0.6 + r);

  // The current keeps the boat in its lane, so every lane has to get blocked in turn
  // or a player could win without touching the screen.
  let voies = rnd() < 0.5 ? [1, -1, 0] : [-1, 1, 0];       // the first rock is dead ahead
  const voie = () => {
    if (!voies.length) {
      voies = [-1, 0, 1];
      for (let i = 2; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [voies[i], voies[j]] = [voies[j], voies[i]]; }
    }
    return voies.pop();
  };
  const rocher = (y, v, r) => rocks.push({ x: center(y) + v * half(y) * 0.55, y, r });

  // New objects arrive one at a time, then each canal offers a few.
  const offerts = ['ciree', 'voile', 'abeille', 'libellule'].slice(0, n < 2 ? 0 : n < 3 ? 1 : n < 5 ? 2 : n < 7 ? 3 : 4);
  let avantObjet = 1;
  let y = 360;
  while (y < len - 260) {
    // A finale swaps the single rocks for ducks, gates and slaloms.
    const roll = finale ? 0.16 + rnd() * 0.46 : rnd(), v = voie(), h = half(y), c = center(y);
    let sortie = -v || (rnd() < 0.5 ? -1 : 1);     // where the flowers lead the player
    if (n >= 2 && roll < 0.16) {
      whirls.push({ x: c + v * h * 0.5, y, r: 46 + rnd() * 12, spin: (rnd() < 0.5 ? -1 : 1) * (110 + n * 5) });
    } else if (n >= 3 && roll < 0.32) {
      ducks.push({ x0: c, y, amp: h * 0.7, w: 0.7 + rnd() * 0.5 + Math.min(n, 10) * 0.03, ph: rnd() * 6.28, r: 13 });
    } else if ((n >= 4 || finale) && roll < 0.47) {
      // A gate: two rocks, the way through is off to one side
      const r = 17 + rnd() * 4, gap = Math.max(70, 96 - n * 2), porte = c + (v || sortie) * h * 0.4;
      rocks.push({ x: porte - gap / 2 - r, y, r }, { x: porte + gap / 2 + r, y, r });
      sortie = v || sortie;
    } else if ((n >= 6 || finale) && roll < 0.62) {
      // A slalom: one rock, then another on the next lane
      const r = 20 + rnd() * 5, w = voie();
      rocher(y, v, r);
      y += 165 + rnd() * 30;
      rocher(y, w, r);
      sortie = -w || sortie;
    } else {
      rocher(y, v, 21 + rnd() * 6 + Math.min(n, 6));
    }
    // Flowers in a chain, curving from the obstacle towards the safe side
    const chaine = (detente ? 5 : n < 5 ? 3 : 4), debut = y + 62 + rnd() * 26;
    for (let i = 0; i < chaine; i++) {
      const fy = debut + i * 40, u = i / (chaine - 1);
      const fx = center(fy) + half(fy) * sortie * (0.15 + 0.5 * Math.sin(u * 3.14));
      if (fy < len - 80 && free(fx, fy, 22)) flowers.push({ x: fx, y: fy, got: false });
    }
    // Objects sit in the risky lane, right behind what was just dodged.
    if (offerts.length && --avantObjet <= 0) {
      const oy = y + 78, ox = center(oy) + v * half(oy) * 0.55;
      if (oy < len - 120 && free(ox, oy, 26)) {
        objets.push({ k: offerts[Math.floor(rnd() * offerts.length)], x: ox, y: oy, pris: false });
        avantObjet = finale ? 6 : 3;        // a finale offers less help
      }
    }
    y += Math.max(205, 250 - n * 4) + rnd() * 50 + (detente ? 110 : 0) - (finale ? 40 : 0);
  }
  const page = finale ? { x: center(len - 130), y: len - 130, pris: false } : null;
  return { n, len, center, half, rocks, whirls, ducks, flowers, objets, speed, page };
}

let L, boat, parts, rings, t, state, level, flowersGot, usedContinue, gusts, shake;

// Flowers are the only currency: they buy boats, papers and start bonuses.

  ['theiere', 600, 'epique'], ['baignoire', 600, 'epique'], ['drakkar', 700, 'epique'], ['caravelle', 700, 'epique'], ['aubes', 800, 'epique'], ['galion', 900, 'epique'],

const rareteChoisie = () => BATEAUX.find(b => b.id === bateauChoisi()).rarete;

  { id: 'ete', quai: '#b88a52', encre: '#2e3a4f', eau: '#7fb89a', berge: '#9dbf5e' },

const multiplicateur = () => Math.min(1 + Math.floor(serie / 3), 4);

function start(n, direct = false, bonus = null) {
  level = n;
  // Lives carry from canal to canal. A new world repairs the boat.
  const repare = n > 1 && n % CANAUX_MONDE === 1 && store.get('vies', 3) < 3;
  if (repare) store.set('vies', 3);
  L = makeLevel(n);
  boat = { x: L.center(0), y: 0, vx: 0, vy: L.speed, hp: store.get('vies', 3), inv: 0, cap: 0, souffle: { x: 0, y: 0, t: 0 }, ciree: false, boost: 0, abeille: 0, ralenti: 0, pop: 0, libre: 0 };
  camY = 0; parts = []; rings = []; t = 0; flowersGot = 0;
  usedContinue = false; gusts = 0; shake = 0;
  gain = 0; encaisse = 0; serie = 0; dernierGust = -1;
  prises = []; bonusUtilise = false;
  gel = 0; flash = 0; finT = 0; chocsPartie = 0;
  if (repare) toast(T.repare);
  chargerMonde(mondeDe(n));
  chrono = 0; trace = []; fantome = store.get('fantomes', {})[n] || null;
  $('toast').hidden = true;
  $('fin').hidden = true;

  $('pretMenus').hidden = store.get('fleurs', 0) === 0 && store.get('niveau', 1) === 1;

  $('pretPortrait').replaceChildren(...(ouverture && images.sprites ? [imageRecit('capitaine-mains')] : []));
  $('pretTexte').textContent = ouverture || n === 1 ? ouverture || T.depart1(estTactile) : n === 2 ? T.depart2 : n === 3 ? T.depart3 : T.depart4;

const temps = () => Math.max(0, chrono - flowersGot * 0.2);   // every flower takes a little off the clock

function partir() {
  state = 'jeu';
  $('pret').hidden = true;
  pub.gameplayStart();
  hud();
}

function mettrePause() {
  state = 'pause';
  pub.gameplayStop();
  $('pause').hidden = false;
  hud();
}

function reprendre() {
  $('pause').hidden = true;
  avecPub(pub.commercialBreak()).then(() => { state = 'jeu'; pub.gameplayStart(); hud(); });
}

// Leaving a run keeps the flowers and the lives it ended with.
function garderPartie() {
  const av = store.get('fleurs', 0);
  store.set('fleurs', av + gain - encaisse);
  encaisse = gain;
  store.set('vies', boat.hp);
  hud();
}

function activerBonus(id) {
  const b = BONUS.find(x => x.id === id);
  bonusUtilise = true;
  if (id === 'ciree') boat.ciree = true;
  else if (id === 'voile') boat.boost = boat.boostMax = b.duree;
  else if (id === 'abeille') boat.abeille = boat.abeilleMax = b.duree;
  else boat.ralenti = boat.ralentiMax = b.duree;
}

const vieSvg = '<svg viewBox="-20 -19 40 36" aria-hidden="true"><polygon points="-9,1 0,-17 9,1" fill="#fffdf6" stroke="#2e3a4f" stroke-width="2" stroke-linejoin="round"/><polygon points="-18,0 18,0 12,12 -12,12" fill="#7cc0d0" stroke="#2e3a4f" stroke-width="2.4" stroke-linejoin="round"/></svg>';
function hud() {

// ---------- Input ----------
const FORCE = 200;                // units/s of a point-blank gust; drifts about 125 units before dying

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'pret') partir();    // the first tap already blows
  if (state === 'jeu') gust(e.clientX, e.clientY);
});
const FLECHES = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] };
addEventListener('keydown', e => {
  if (!$('pliage').hidden || !$('recit').hidden || !$('livre').hidden || !$('voyage').hidden || !$('profil').hidden || !$('boutique').hidden || !$('avant').hidden) return;
  if (e.key === 'Escape' || (e.key === ' ' && state !== 'pret')) {
    if (state === 'jeu') mettrePause();
    else if (state === 'pause') reprendre();
    return;
  }
  const fleche = FLECHES[e.key];
  if (fleche && !e.repeat) {
    e.preventDefault();
    if (state === 'pret') partir();
    if (state === 'jeu') {
      souffler(fleche[0], fleche[1], 0.8);
      effetRafale(boat.x - fleche[0] * 70, boat.y - fleche[1] * 70, fleche[0], fleche[1]);
    }
  } else if ((e.key === ' ' || e.key === 'Enter') && state === 'pret') partir();
  else if ((e.key === 'r' || e.key === 'R') && (state === 'port' || state === 'coule')) relancer(level);
});

function gust(sx, sy) {
  const wx = (sx - offX) / scale, wy = camY + anchor() - sy / scale;
  let dx = boat.x - wx, dy = boat.y - wy, d = Math.hypot(dx, dy);
  if (d < 8) { dx = 0; dy = 1; d = 1; }
  // Fades gently with distance, so a tap anywhere still does something useful.
  souffler(dx / d, dy / d, 1 - 0.4 * Math.min(d / 280, 1));
  effetRafale(wx, wy, dx / d, dy / d);
}

function souffler(ux, uy, puissance) {
  // Mashing doesn't add up: a gust right after another is weaker.
  const f = FORCE * puissance * (t - dernierGust < 0.18 ? 0.55 : 1);
  dernierGust = t;
  // Most of the push is immediate so it feels instant, the rest blows in over a few frames.
  boat.vx += ux * f * 0.65;
  boat.vy += uy * f * 0.65;
  boat.souffle = { x: ux * f * 0.35, y: uy * f * 0.35, t: 0.12 };
  boat.pop = 0.18;
  boat.libre = 1;
  gusts++;
  vibrer(6);
  for (let i = 0; i < 3; i++) {
    const a = Math.atan2(-uy, -ux) + (Math.random() - 0.5) * 1.2, v = 50 + Math.random() * 60;
    parts.push({ k: 'goutte', x: boat.x, y: boat.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35, max: 0.35 });
  }
  son.rafale(f / FORCE);
}

function effetRafale(wx, wy, ux, uy) {
  if (rareteChoisie() === 'legendaire') prises.push({ k: 'rafale', x: wx, y: wy, t: 0 });
  else rings.push({ x: wx, y: wy, t: 0 });
  const a0 = Math.atan2(uy, ux);
  for (let i = 0; i < 9; i++) {
    const a = a0 + (Math.random() - 0.5) * 0.8, s = 170 + Math.random() * 170;
    parts.push({ k: 'vent', x: wx, y: wy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45, max: 0.45 });
  }
}

// ---------- Simulation ----------
function hit(nx, ny) {
  if (boat.inv > 0 || boat.boost > 0) return;
  if (boat.ciree) {
    boat.ciree = false;
    boat.inv = 1;
    shake = 0.15;
    son.choc();
    vibrer(25);
    gel = 0.05;
    prises.push({ k: 'burst', x: boat.x, y: boat.y, t: 0 });
    return;
  }
  boat.hp--;
  boat.inv = 1.2;
  shake = 0.35;
  serie = 0;
  chocsPartie++;
  gel = 0.075;
  flash = calme ? 0 : 0.12;
  vibrer(boat.hp <= 1 ? 90 : 45);
  rings.push({ x: boat.x, y: boat.y, t: 0, choc: true });
  son.choc();
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * 6.28, s = 60 + Math.random() * 190;
    parts.push({ k: 'goutte', x: boat.x - nx * 10, y: boat.y - ny * 10, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6 });
  }
  if (boat.hp <= 0) end(false);
}

function collideCircle(ox, oy, r) {
  const dx = boat.x - ox, dy = boat.y - oy, d = Math.hypot(dx, dy), min = r + 11;
  if (d >= min || d === 0) return;
  const nx = dx / d, ny = dy / d;
  boat.x = ox + nx * min; boat.y = oy + ny * min;
  const vn = boat.vx * nx + boat.vy * ny;
  if (vn < 0) {
    boat.vx -= 1.5 * vn * nx; boat.vy -= 1.5 * vn * ny;
    if (vn < -45) hit(nx, ny);       // a slow graze is forgiven
  }
}

let toastFin;
function toast(texte) {
  $('toast').textContent = texte;
  $('toast').hidden = false;
  clearTimeout(toastFin);
  toastFin = setTimeout(() => { $('toast').hidden = true; }, 1800);
}

// Two confetti cannons on the masts, then a shower over the whole canal.
function feteArrivee() {
  const c = L.center(L.len), h = L.half(L.len) + 7, y = L.len + 10;
  rings.push({ x: boat.x, y: boat.y, t: 0, or: true });
  etincelles(boat.x, boat.y, 18);
  boat.pop = 0.18;
  if (calme) return;
  const confetti = (x, py, vx, vy, vie) => parts.push({ k: 'confetti', couleur: FANIONS[parts.length % 4], x, y: py, vx, vy, life: vie, max: 2, tour: Math.random() * 6 });
  for (const cote of [-1, 1]) {
    for (let i = 0; i < 34; i++) {
      confetti(c + cote * h, y, -cote * (90 + Math.random() * 520), 180 + Math.random() * 560, 1.5 + Math.random() * 0.7);
    }
  }
  for (let i = 0; i < 30; i++) {
    confetti(c + (Math.random() - 0.5) * h * 2, y + 170 + Math.random() * 120, (Math.random() - 0.5) * 60, -20, 1.6 + Math.random() * 0.6);
  }
}

function etincelles(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = 50 + Math.random() * 130;
    parts.push({ k: 'etincelle', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.55, max: 0.55 });
  }
}

function texte(txt, x, y, taille = 34) {
  parts.push({ k: 'texte', txt, taille, x, y, vx: 0, vy: 40, life: 0.9, max: 0.9 });
}

function bump(el) {
  if (el.animate && !calme) el.animate([{ transform: 'scale(1.45)' }, { transform: 'scale(1)' }], { duration: 200, easing: 'ease-out' });
}

// Passing a rock by a hair pays a little.
function frole(b) {
  gain++;
  texte(T.frole, b.x, b.y + 30, 26);
  etincelles(b.x, b.y, 6);
  vibrer(8);
  bump($('hFl'));
}

function attraper(o) {
  const b = boat, vus = store.get('objetsVus', {});
  o.pris = true;
  son.bonus();
  vibrer([12, 40, 12]);
  rings.push({ x: o.x, y: o.y, t: 0, or: true });
  etincelles(o.x, o.y, 12);
  prises.push({ k: o.k, x: o.x, y: o.y, t: 0 });
  if (o.k === 'ciree') b.ciree = true;
  else if (o.k === 'voile') { b.boost = b.boostMax = 2.5; b.vy += 150; }
  else if (o.k === 'abeille') b.abeille = b.abeilleMax = 6;
  else b.ralenti = b.ralentiMax = 3;
  toast(vus[o.k] ? T.objets[o.k] : T.aides[o.k]);
  if (!vus[o.k]) { vus[o.k] = true; store.set('objetsVus', vus); }
}

function update(dt) {
  const reel = dt;
  if (state === 'jeu' && boat.ralenti > 0) dt *= 0.45;
  t += dt;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const r of rings) r.t += dt;
  for (const p of prises) p.t += reel;
  flash = Math.max(0, flash - reel);
  if (boat.pop > 0) boat.pop = Math.max(0, boat.pop - reel);
  for (const p of parts) if (p.k === 'confetti') p.vy -= 260 * dt;
  if (parts.length > 260) parts.splice(0, parts.length - 260);
  if (state === 'coule') {
    finT += dt;
    if (Math.random() < dt * 24) parts.push({ k: 'bulle', x: boat.x + (Math.random() - 0.5) * 22, y: boat.y, vx: 0, vy: 26, life: 0.7, max: 0.7 });
  }
  prises = prises.filter(p => p.t < 0.3);
  rings = rings.filter(r => r.t < 0.5);
  shake = Math.max(0, shake - dt);
  if (state === 'port') {
    // Past the finish, the boat just drifts on under the bunting.
    boat.y += L.speed * 0.8 * dt;
    boat.x += (L.center(boat.y) - boat.x) * Math.min(1, dt * 1.5);
    boat.cap += Math.atan2(Math.sin(-boat.cap), Math.cos(-boat.cap)) * Math.min(1, dt * 5);
  }
  if (state !== 'jeu') return;

  const b = boat;
  b.inv = Math.max(0, b.inv - dt);
  b.boost = Math.max(0, b.boost - reel);
  b.abeille = Math.max(0, b.abeille - reel);
  b.ralenti = Math.max(0, b.ralenti - reel);
  if (b.ralenti <= 0) chrono += reel;        // the dragonfly stops the clock, so it is a real gain
  if (trace.length <= chrono * 10) trace.push([Math.round(b.x), Math.round(b.y)]);

  // Water current follows the canal, plus whirlpools
  const slope = (L.center(b.y + 2) - L.center(b.y - 2)) / 4;
  const courant = L.speed * (b.boost > 0 ? 2.2 : 1);
  let tx = slope * courant, ty = courant;
  // Whirlpools reach beyond their rim, grip hard near the middle, and spin the boat.
  // A gust breaks the grip for a moment, so escaping always works.
  let prise = 0;
  b.libre = Math.max(0, b.libre - reel);
  for (const w of L.whirls) {
    const dx = b.x - w.x, dy = b.y - w.y, d = Math.hypot(dx, dy), portee = w.r * 1.5;
    if (d < portee && d > 1) {
      const f = 1 - d / portee, lache = b.libre > 0 ? 0.05 : 1;
      // Inside its reach the whirlpool replaces the current, it doesn't just add to it.
      const courantReste = 1 - Math.min(1, f * 2.2) * lache;
      tx = tx * courantReste + ((-dy / d) * w.spin * (0.5 + f) - dx / d * (110 + 300 * f)) * lache;
      ty = ty * courantReste + ((dx / d) * w.spin * (0.5 + f) - dy / d * (110 + 300 * f)) * lache;
      prise = Math.max(prise, f * lache);
    }
  }
  if (b.souffle.t > 0) {
    const part = Math.min(dt, b.souffle.t) / 0.12;
    b.vx += b.souffle.x * part;
    b.vy += b.souffle.y * part;
    b.souffle.t -= dt;
  }
  const vitesse = Math.hypot(b.vx, b.vy);
  if (vitesse > 420) { b.vx *= 420 / vitesse; b.vy *= 420 / vitesse; }
  const k = 1 - Math.exp(-(1.6 + prise * 3.5) * dt);
  b.vx += (tx - b.vx) * k;
  b.vy += (ty - b.vy) * k;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  // Side-on while it drifts; turns to face the way it is pushed.
  const pousse = Math.hypot(b.vx - tx, b.vy - ty) > 40;
  const vise = pousse ? Math.atan2(b.vy, b.vx) : Math.cos(b.cap) >= 0 ? 0 : Math.PI;
  const ecart = Math.atan2(Math.sin(vise - b.cap), Math.cos(vise - b.cap));
  b.cap += ecart * Math.min(1, dt * (pousse ? 14 : 5));

  // Banks
  const c = L.center(b.y), h = L.half(b.y) - 11, dx = b.x - c;
  if (Math.abs(dx) > h) {
    const s = Math.sign(dx);
    b.x = c + s * h;
    const vn = b.vx * s;
    if (vn > 0) { b.vx = -b.vx * 0.4; if (vn > 110) hit(s, 0); }
  }
  if (b.y < -40) { b.y = -40; b.vy = Math.max(b.vy, 0); }

  if (b.boost <= 0) {
    for (const r of L.rocks) if (Math.abs(r.y - b.y) < 60) collideCircle(r.x, r.y, r.r);
    for (const d of L.ducks) if (Math.abs(d.y - b.y) < 60) collideCircle(duckX(d), d.y, d.r);
  }
  for (const o of L.objets) if (!o.pris && Math.hypot(o.x - b.x, o.y - b.y) < 28) attraper(o);
  if (L.page && !L.page.pris && Math.hypot(L.page.x - b.x, L.page.y - b.y) < 46) {
    L.page.pris = true;
    son.port();
    vibrer([12, 40, 12]);
    rings.push({ x: L.page.x, y: L.page.y, t: 0, or: true });
    etincelles(L.page.x, L.page.y, 16);
  }
  for (const r of L.rocks) {
    if (r.vu || Math.abs(r.y - b.y) > 90) continue;
    r.pres = Math.min(r.pres === undefined ? 1e9 : r.pres, Math.hypot(r.x - b.x, r.y - b.y) - r.r);
    if (b.y > r.y + r.r + 16) {
      r.vu = true;
      if (r.pres < 24 && b.inv <= 0 && b.boost <= 0) frole(b);
    }
  }

  for (const f of L.flowers) {
    if (f.got) continue;
    const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy);
    // Flowers lean towards a near boat, and fly to it with the bee.
    const vite = b.abeille > 0 ? 7 : 5;
    if (d < (b.abeille > 0 ? 170 : 50)) { f.x += dx * dt * vite; f.y += dy * dt * vite; }
    if (d < 24) {
      f.got = true; flowersGot++; serie++;
      const mult = multiplicateur();
      gain += mult;
      son.fleur(serie);
      // A long clean chain patches the boat up.
      if (serie % 12 === 0 && b.hp < 3) { b.hp++; texte(T.vieGagnee, b.x, b.y + 34, 26); toast(T.vieGagnee); son.bonus(); }
      if (mult > 1 && serie % 3 === 0) { texte('×' + mult, f.x, f.y, 30 + mult * 6); rings.push({ x: f.x, y: f.y, t: 0, or: true }); }
      vibrer(6 + mult * 3);
      bump($('hFl'));
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * 6.28 + Math.random() * 0.4, v = 80 + mult * 20 + Math.random() * 40;
        parts.push({ k: 'petale', x: f.x, y: f.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.55, max: 0.55 });
      }
      etincelles(f.x, f.y, 2 + mult);
    }
  }

  if (bateauChoisi() !== 'classique' && Math.random() < dt * 9) {
    parts.push({ k: 'trace', n: 1 + Math.floor(Math.random() * 3), x: b.x + (Math.random() - 0.5) * 16, y: b.y - 16, vx: (Math.random() - 0.5) * 24, vy: -b.vy * 0.25, life: 1, max: 1, epique: rareteChoisie() === 'epique' && Math.random() < 0.6 });
    if (rareteChoisie() === 'legendaire') etincelles(b.x, b.y - 10, 1);
  }
  if (Math.random() < dt * (30 + Math.hypot(b.vx, b.vy) * 0.3)) {
    parts.push({ k: 'bulle', x: b.x + (Math.random() - 0.5) * 12, y: b.y - 10, vx: (Math.random() - 0.5) * 20, vy: -10, life: 0.8, max: 0.8 });
  }

  camY += (b.y - camY) * Math.min(1, dt * 5);
  if (b.y >= L.len) end(true);
  hud();
}

const duckX = d => d.x0 + d.amp * Math.sin(t * d.w + d.ph);

// ---------- End of a run ----------
function avecPub(promesse) {
  son.pause(true);
  enPub = true;
  return promesse.finally(() => { son.pause(false); enPub = false; });
}

const PELLICULE = '<span class="pellicule" aria-hidden="true">🎬</span>';

function end(won) {
  state = won ? 'port' : 'coule';
  pub.gameplayStop();
  if (won) son.port(); else son.coule();
  vibrer(won ? [20, 50, 20, 50, 40] : 90);
  if (won) feteArrivee();
  // A sunk boat is folded again from scratch.
  store.set('vies', won ? boat.hp : 3);
  const total = L.flowers.length;
  const avant = store.get('fleurs', 0), apres = avant + gain - encaisse;
  encaisse = gain;
  store.set('fleurs', apres);
  $('finWindy').replaceChildren(imageRecit(won ? 'vent-4' : 'vent-2'));
  $('finTitre').textContent = won ? (store.get('nom') ? T.gagneNom(store.get('nom')) : T.gagne) : T.perdu;
  $('finTexte').textContent = won
    ? T.score(flowersGot, total, chocsPartie === 0)
    : T.reste(Math.max(1, Math.round((1 - boat.y / L.len) * 100)));
  const stars = won ? 1 + (flowersGot >= total * 0.6) + (chocsPartie === 0) : 0;
  $('finEtoiles').innerHTML = won ? [0, 1, 2].map(i => `<span class="${i < stars ? '' : 'vide'}">★</span>`).join('') : '';
  montrerTemps(won);
  if (won) {
    const etoiles = store.get('etoiles', {});
    if (stars > (etoiles[level] || 0)) { etoiles[level] = stars; store.set('etoiles', etoiles); }
  }
  montrerProgres($('finProgres'), avant, apres);
  montrerNouveau(avant, apres);
  montrerPage(won);
  const gainPartie = apres - avant;
  const btns = $('finBoutons');
  btns.innerHTML = '';
  const add = (label, cls, fn) => {
    const el = document.createElement('button');
    el.textContent = label; if (cls) el.className = cls;
    if (cls === 'video') el.insertAdjacentHTML('afterbegin', PELLICULE);
    el.addEventListener('click', fn);
    btns.appendChild(el);
    return el;
  };
  const menus = () => {
    const duo = document.createElement('div');
    duo.className = 'duo';
    for (const [label, fn] of [[T.boutique, () => ouvrirBoutique()], [T.carnet, ouvrirCarnet]]) {
      const el = document.createElement('button');
      el.textContent = label; el.className = 'discret';
      el.addEventListener('click', fn);
      duo.appendChild(el);
    }
    btns.appendChild(duo);
  };
  if (won) {
    const best = store.get('niveau', 1);
    if (level + 1 > best) store.set('niveau', level + 1);
    const finale = level === 25 ? ['fin1', H.fin] : level === 50 ? ['fin2', H.fin2] : null;
    if (finale && !store.get(finale[0])) add(T.auPhare, '', () => terminerVoyage(finale[0], finale[1]));
    else add(T.suivant, '', () => lancer(level + 1));
    if (gainPartie > 0) {
      const b = add(T.doubler, 'video', () => avecPub(pub.rewardedBreak()).then(ok => {
        if (!ok) return;
        b.remove();
        const av = store.get('fleurs', 0), ap = av + gainPartie;
        store.set('fleurs', ap);
        son.port();
        montrerProgres($('finProgres'), av, ap);
        montrerNouveau(av, ap);
      }));
    }
    if (boat.hp < 3) proposerReparation(btns);
    add(T.rejouerCanal, 'discret', () => relancer(level));
    if (SDK && !compte && level % CANAUX_MONDE === 0) add(T.connecter, 'discret', connecter);
    menus();
  } else {
    add(T.rejouer, '', () => relancer(level));
    if (!usedContinue) add(T.repartir, 'video', () => avecPub(pub.rewardedBreak()).then(ok => {
      if (!ok) return;
      usedContinue = true;
      boat.hp = 1; boat.inv = 2.5;
      boat.x = L.center(boat.y); boat.vx = 0; boat.vy = L.speed;
      $('fin').hidden = true;
      state = 'jeu'; pub.gameplayStart(); hud();
    }));
    menus();
  }
  hud();
  setTimeout(() => { if (state !== 'jeu') $('fin').hidden = false; }, won ? 1200 : 450);
}

// ---------- Rewards ----------
// Ads before every return to play: Poki decides when one actually shows.
function relancer(n, bonus = null) {
  avecPub(pub.commercialBreak()).then(() => start(n, true, bonus));
}

// A few canals open with an optional bonus. Never on a retry, which stays one tap.
function lancer(n) {
  const stock = store.get('stock', {}), enStock = BONUS.find(b => stock[b.id] > 0);
  if (n < 4 || !(enStock || n % 3 === 0)) { avecPub(pub.commercialBreak()).then(() => start(n, n > 3 && n % CANAUX_MONDE !== 1)); return; }
  montrerAvant(n, (enStock || BONUS[n % BONUS.length]).id);
}

function icone(nom, w = 112, h = w) {
  const c = document.createElement('canvas'), [x, y, cw, ch] = ATLAS.cases[nom];
  c.width = w; c.height = h;
  if (images.sprites) c.getContext('2d').drawImage(images.sprites, x, y, cw, ch, 0, 0, w, h);
  return c;
}
const MEDAILLES = ['medal-empty', 'medal-bronze', 'medal-silver', 'medal-gold'];
const SEUILS = [1, 0.9, 0.8];
const iconeMedaille = m => icone(MEDAILLES[m], 64, 72);
const flor = '<svg class="fleurette" viewBox="-12 -12 24 24" aria-hidden="true"><g fill="#e8578e"><ellipse cy="-5.5" rx="3.8" ry="5.5"/><ellipse cy="-5.5" rx="3.8" ry="5.5" transform="rotate(72)"/><ellipse cy="-5.5" rx="3.8" ry="5.5" transform="rotate(144)"/><ellipse cy="-5.5" rx="3.8" ry="5.5" transform="rotate(216)"/><ellipse cy="-5.5" rx="3.8" ry="5.5" transform="rotate(288)"/></g><circle r="3.2" fill="#f6c945"/></svg>';

// A run saved by the video or helped by a start bonus doesn't count for the clock.
function montrerTemps(won) {
  const el = $('finTemps'), v = temps();
  el.hidden = !won || usedContinue || bonusUtilise;
  if (el.hidden) return;
  const ratio = v / (L.len / L.speed), medaille = SEUILS.filter(x => ratio <= x).length;
  const records = store.get('records', {}), medailles = store.get('medailles', {});
  const record = !(level in records) || v < records[level];
  if (record) {
    records[level] = +v.toFixed(1);
    store.set('records', records);
    const fantomes = store.get('fantomes', {});
    fantomes[level] = trace;
    store.set('fantomes', fantomes);
  }
  if (medaille > (medailles[level] || 0)) { medailles[level] = medaille; store.set('medailles', medailles); }
  el.innerHTML = '';
  if (medaille) el.append(iconeMedaille(medaille));
  el.insertAdjacentHTML('beforeend', `<span>${fmtTemps(v)}</span>` + (record ? `<b>${T.record}</b>` : ''));
}

function choisirBateau(id) {
  store.set('bateau', id);
  charger(feuilleBateau());
}

// The next thing to save for: the cheapest boat or paper not owned yet.
const aAcheter = () => BATEAUX.filter(b => !possede('bateaux', b.id)).map(b => ({ ...b, nom: T.noms[b.id] })).sort((a, b) => a.prix - b.prix);

function montrerProgres(el, avant, apres) {
  const suivant = aAcheter().find(b => b.prix > apres);
  const plus = apres > avant ? T.plus(apres - avant) : '';
  if (!suivant) { el.innerHTML = `<span>${plus}${aAcheter().length ? '' : T.tous}</span>`; return; }
  const part = v => clamp(v / suivant.prix, 0, 1) * 100 + '%';
  el.innerHTML = `<span>${plus}${T.prochain(suivant.nom, suivant.prix - apres)}</span><div class="piste"><i></i></div>`;
  const barre = el.querySelector('i');
  barre.style.width = part(avant);
  requestAnimationFrame(() => requestAnimationFrame(() => { barre.style.width = part(apres); }));
}

function montrerNouveau(avant, apres) {
  const el = $('finNouveau'), dispo = aAcheter().filter(b => b.prix > avant && b.prix <= apres).pop();
  el.hidden = !dispo;
  if (!dispo) return;
  el.innerHTML = `<span>${T.peutAcheter}<br>${dispo.nom}</span>`;
  el.prepend(icone('vignette-' + dispo.id));
  const b = document.createElement('button');
  b.textContent = T.voir;
  b.addEventListener('click', () => ouvrirBoutique('bateaux'));
  el.appendChild(b);
}

// Between canals, a lost life comes back for flowers or a video.
function proposerReparation(btns) {
  const duo = document.createElement('div');
  duo.className = 'fin-soin';
  const soigner = () => {
    boat.hp++;
    store.set('vies', boat.hp);
    son.bonus();
    hud();
    if (boat.hp >= 3) duo.remove(); else achat.disabled = store.get('fleurs', 0) < PRIX_REPARATION;
  };
  const achat = document.createElement('button');
  achat.className = 'achat';
  achat.innerHTML = `<span class="prix">${T.reparer} ${flor}${PRIX_REPARATION}</span>`;
  achat.disabled = store.get('fleurs', 0) < PRIX_REPARATION;
  achat.addEventListener('click', () => {
    const av = store.get('fleurs', 0);

// ---------- Story ----------
const nomCapitaine = () => store.get('nom') || '';

// Reads panels one at a time. Everything can be skipped.
function imageRecit(nom) {
  const img = new Image();
  img.alt = '';
  img.src = `assets/${nom}.webp`;
  return img;
}

function raconter(panneaux, visuels, fin) {
  let i = 0;
  const texte = $('recitTexte');
  visuels.forEach(imageRecit);           // fetched ahead, so no picture pops in late
  const montrer = () => {
    const ancienne = $('recitImage'), nouvelle = imageRecit(visuels[i]), t = panneaux[i];
    nouvelle.id = 'recitImage';
    nouvelle.className = visuels[i].startsWith('recit-') ? '' : 'objet';
    ancienne.replaceWith(nouvelle);
    const p = texte.cloneNode();         // a fresh node restarts the fade
    p.textContent = typeof t === 'function' ? t(nomCapitaine()) : t;
    $('recitTexte').replaceWith(p);
    $('recitSuite').textContent = i < panneaux.length - 1 ? T.suivante : T.terminer;
  };
  const clore = () => { $('recit').hidden = true; fin(); };
  $('recitSuite').onclick = () => { if (++i < panneaux.length) montrer(); else clore(); };
  $('recitPasser').onclick = clore;
  montrer();
  $('recit').hidden = false;
}

// Temporary reading tool, opened with #relire: every story beat with no need to play.
function relireHistoire() {
  const etapes = [], ajoute = (groupe, image, texte) => etapes.push({ groupe, image, texte });
  H.intro.forEach((t, i) => ajoute(T.relireIntro, IMAGES_INTRO[i], t));
  H.chapitres.forEach((c, i) => {
    const groupe = `${i + 1}. ${c.titre}`;
    ajoute(groupe, 'capitaine-mains', c.depart);
    ajoute(groupe, 'page-perdue', `${T.pageTrouvee} ${c.titre}. ${c.trouve}`);
    c.bateaux.forEach(([nom, epoque, texte], j) => ajoute(groupe, 'vignette-' + BATEAUX_LIVRE[i][j], `${nom} (${epoque}) : ${texte}`));
  });
  H.fin.forEach((t, i) => ajoute(T.relireFin, IMAGES_FIN.fin1[i], t));
  H.fin2.forEach((t, i) => ajoute(T.relireFin2, IMAGES_FIN.fin2[i], t));

  const choix = $('recitChoix');
  choix.options.length = 0;
  [...new Set(etapes.map(e => e.groupe))].forEach(g => choix.add(new Option(g, g)));
  let i = 0;
  const montrer = () => {
    const e = etapes[i], vue = e.image.startsWith('vignette-') ? icone(e.image, 288) : imageRecit(e.image);
    vue.id = 'recitImage';
    vue.className = e.image.startsWith('recit-') ? '' : 'objet';
    $('recitImage').replaceWith(vue);
    const p = $('recitTexte').cloneNode();
    p.textContent = typeof e.texte === 'function' ? e.texte(nomCapitaine()) : e.texte;
    $('recitTexte').replaceWith(p);
    choix.value = e.groupe;
    $('recitNumero').textContent = `${i + 1} / ${etapes.length}`;
  };
  const va = n => { i = clamp(n, 0, etapes.length - 1); montrer(); };
  $('recitPasser').textContent = '‹';
  $('recitSuite').textContent = '›';
  $('recitPasser').onclick = () => va(i - 1);
  $('recitSuite').onclick = () => va(i + 1);
  choix.onchange = () => va(etapes.findIndex(e => e.groupe === choix.value));
  $('recitFermer').onclick = () => { $('recit').hidden = true; $('recitBarre').hidden = true; $('recit').classList.remove('lecture'); $('recitPasser').textContent = T.passer; };
  $('recitBarre').hidden = false;
  $('recit').classList.add('lecture');
  $('recit').hidden = false;
  montrer();
}

// The hard canal closing each world hands back a page of the book.
function montrerPage(won) {
  const el = $('finPage'), pages = store.get('pages', []), c = chapitreDe(level);
  el.hidden = !(won && level % CANAUX_MONDE === 0);

function ouvrirLivre(aMontrer = null) {
  const pages = store.get('pages', []), zone = $('livrePages');
  // The childhood pages stay secret until the first book is complete.
  const total = store.get('fin1') ? H.chapitres.length : 5;
  $('livreImage').replaceChildren(imageRecit(store.get('fin1') ? 'livre-complet' : 'livre-manquant'));
  $('livreCompte').textContent = T.pagesSur(pages.filter(c => c < total).length, total);

function ficheTenue(b, cle, image, nom, actuel, choisir, fleurs) {
  const offert = cle === 'bateaux' && store.get('cadeau') && b.rarete !== 'legendaire';
  const el = document.createElement('div'), a = possede(cle, b.id), equipe = b.id === actuel, assez = offert || fleurs >= b.prix;
  el.className = 'fiche' + (equipe ? ' equipe' : '') + (!a && !assez ? ' loin' : '');
  el.innerHTML = '<div class="eau"></div>';
  el.firstChild.append(icone(image));
  el.insertAdjacentHTML('beforeend', `<b>${nom}</b><small>${equipe ? T.surBateau : a ? T.aToi : assez ? T.dispo : T.manque(b.prix - fleurs)}</small>`);
  const btn = document.createElement('button');
  if (equipe) { btn.textContent = '✓ ' + T.equipe; btn.className = 'equipe-btn'; btn.disabled = true; }
  else if (a) {
    btn.textContent = T.utiliser; btn.className = 'utiliser';
    btn.addEventListener('click', () => { choisir(b.id); ouvrirBoutique(); });
  } else {
    btn.innerHTML = offert ? T.offert : `<span class="prix">${flor}${b.prix}</span>`; btn.className = 'achat'; btn.disabled = !assez;
    btn.addEventListener('click', () => {
      const liste = store.get(cle, []);

      else store.set('fleurs', fleurs - b.prix);
      store.set(cle, [...liste, b.id]);
      choisir(b.id);
      revelerAchat(b, nom, () => ouvrirBoutique());
    });
  }
  el.appendChild(btn);
  return el;
}

function grilleCanaux(de, a, atteint) {
  const etoiles = store.get('etoiles', {}), records = store.get('records', {}), medailles = store.get('medailles', {});
  const g = document.createElement('div');
  g.className = 'grille';
  for (let n = de; n <= a; n++) {

    el.className = 'canal';

    if (medailles[n]) el.querySelector('small').prepend(iconeMedaille(medailles[n]));
    el.addEventListener('click', () => relancer(n));
    g.appendChild(el);
  }
  return g;
}

// A slice of the world's canal, built from its real sprites, so each page reads at a glance.
function sceneMonde(m) {
  const c = document.createElement('canvas'), w = 640, h = 200, g = c.getContext('2d');
  c.width = w; c.height = h; c.className = 'vue';
  chargerMonde(m).then(() => {
    const berge = images[m.id + '-berge'], eau = images[m.id + '-eau'], atlas = images['monde-' + m.id], cases = ATLAS_MONDES[m.id];
    if (!atlas) return;
    g.fillStyle = berge ? g.createPattern(berge, 'repeat') : m.berge;
    g.fillRect(0, 0, w, h);
    const rive = (dy, sens) => {
      for (let x = sens > 0 ? 0 : w; sens > 0 ? x <= w : x >= 0; x += 16 * sens) g.lineTo(x, 100 + dy + 12 * Math.sin(x / 90));
    };
    g.beginPath(); rive(-50, 1); rive(50, -1); g.closePath();
    g.fillStyle = eau ? g.createPattern(eau, 'repeat') : m.eau;
    g.fill();
    for (const [dy, couleur, l] of [[-55, m.quai, 12], [55, m.quai, 12], [-50, m.encre, 2], [50, m.encre, 2]]) {
      g.beginPath(); rive(dy, 1); g.strokeStyle = couleur; g.lineWidth = l; g.stroke();
    }
    const pose = (nom, x, y, k = 2) => {
      const b = cases[nom];
      if (b) g.drawImage(atlas, b[0], b[1], b[2], b[3], x - b[2] / 6 * k, y - b[3] / 6 * k, b[2] / 3 * k, b[3] / 3 * k);
    };
    pose('decor-0', 70, 26, 1.5); pose('decor-1', 330, 22, 1.5); pose('decor-2', 580, 28, 1.5);
    pose('decor-3', 200, 178, 1.5); pose('decor-4', 470, 180, 1.5);
    pose('rocher', 130, 100, 1.5); pose('fleur', 300, 96, 1.7); pose('mob-1', 480, 104, 1.8);
  });
  return c;
}

function ouvrirCarnet() {
  const atteint = store.get('niveau', 1), etoiles = store.get('etoiles', {}), zone = $('voyageMondes');
  zone.innerHTML = '';
  $('voyageProfil').innerHTML = '';
  $('voyageProfil').append(icone('tampon-' + store.get('tampon', 'mouette')));
  // After the last world the journey starts over, one more lap of the seasons each time.
  const pages = Math.ceil(atteint / (CANAUX_MONDE * MONDES.length)) * MONDES.length;
  for (let i = 0; i < pages; i++) {
    const m = MONDES[i % MONDES.length];
    const de = i * CANAUX_MONDE + 1, a = de + CANAUX_MONDE - 1, ouvert = atteint >= de, courant = ouvert && atteint <= a;
    let nb = 0;
    for (let n = de; n <= a; n++) nb += etoiles[n] || 0;
    const el = document.createElement('div');
    el.className = 'monde' + (ouvert ? '' : ' ferme');
    const statut = !ouvert ? T.ouvertApres(T.mondes[MONDES[(i - 1) % MONDES.length].id]) : courant ? T.enCours : T.termine;
    el.innerHTML = `<button><div class="titre"><b>${T.mondes[m.id]}</b><span>${T.etoilesSur(nb, CANAUX_MONDE * 3)} · ${statut}</span></div></button>`;
    el.firstChild.prepend(sceneMonde(m));
    const grille = grilleCanaux(de, a, atteint);
    grille.hidden = !courant;
    el.appendChild(grille);
    if (ouvert) el.firstChild.addEventListener('click', () => { grille.hidden = !grille.hidden; });
    zone.appendChild(el);
  }
  $('voyage').hidden = false;
}

// ---------- Drawing ----------
// Images come from design/sprites.py. Until they load the game shows plain colours.
const images = {}, motifs = {};
const C = { reserve: '#fffdf6', bois: '#8a5a32' };
const FANIONS = ['#f6c945', '#3e8ba8', '#e8578e', '#ee9b54'];
const TAU = Math.PI * 2;

function charger(nom) {
  if (images[nom]) return Promise.resolve();
  return new Promise(ok => {
    const i = new Image();
    i.onload = () => { images[nom] = i; ok(); };
    i.onerror = ok;
    i.src = `assets/${nom}.webp`;
  });
}

function dessin(image, [cx, cy, cw, ch], x, y, k, rot, flip, ky = 1) {
  if (!image) return;
  const w = cw / ATLAS.x * k, h = ch / ATLAS.x * k * ky;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(image, cx, cy, cw, ch, -w / 2, -h / 2, w, h);
  ctx.restore();
}

const sprite = (nom, x, y, k = 1, rot = 0, flip = false) => dessin(images.sprites, ATLAS.cases[nom], x, y, k, rot, flip);
const spriteM = (nom, x, y, k = 1, rot = 0, flip = false) => {
  const m = mondeDe(level), c = ATLAS_MONDES[m.id][nom];
  if (c) dessin(images['monde-' + m.id], c, x, y, k, rot, flip);
};

// Tiles stay pinned to the world so the banks and water scroll together.
function motif(nom, pxParUnite, secours) {
  if (!images[nom]) return secours;
  const m = motifs[nom] || (motifs[nom] = ctx.createPattern(images[nom], 'repeat'));
  m.setTransform(new DOMMatrix().translate(0, Y(0) % 360).scale(1 / pxParUnite));
  return m;
}

function draw() {
  const force = calme ? 4 : 18;
  const sx = shake > 0 ? (Math.random() - 0.5) * force * shake : 0;
  const sy = shake > 0 ? (Math.random() - 0.5) * force * shake : 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx), dpr * sy);
  ctx.imageSmoothingQuality = 'high';
  ctx.lineCap = 'round';

  const yTop = camY + anchor() + 30, yBot = Math.floor((camY + anchor() - viewH - 30) / 8) * 8;
  const xMin = -offX / scale - 10, xMax = (cssW - offX) / scale + 10;

  const M = mondeDe(level), encre = M.encre;
  const decors = Object.keys(ATLAS_MONDES[M.id]).filter(k => k.startsWith('decor-')).length;
  ctx.fillStyle = motif(M.id + '-berge', 2, M.berge);
  ctx.fillRect(xMin - 10, -10, xMax - xMin + 20, viewH + 20);

  // Scenery, never near the water
  for (let j = Math.floor(yBot / 70); j <= yTop / 70; j++) {
    for (let i = 0; i < 3; i++) {
      const hx = xMin + hash(j * 5 + i) * (xMax - xMin), hy = j * 70 + hash(j * 11 + i) * 70;
      const pres = [hy - 26, hy, hy + 26].some(y => Math.abs(hx - L.center(y)) < L.half(y) + 40);
      if (!pres) spriteM('decor-' + Math.floor(hash(j * 3 + i * 7) * decors), hx, Y(hy));
    }
  }

  // Canal: ochre stone, wash water, ink lines
  const edge = () => {
    ctx.beginPath();
    for (let y = yBot; y <= yTop; y += 8) ctx.lineTo(L.center(y) - L.half(y), Y(y));
    for (let y = Math.floor(yTop / 8) * 8; y >= yBot; y -= 8) ctx.lineTo(L.center(y) + L.half(y), Y(y));
    ctx.closePath();
  };
  const rive = (s, off) => {
    ctx.beginPath();
    for (let y = yBot; y <= yTop; y += 8) ctx.lineTo(L.center(y) + s * (L.half(y) + off), Y(y));
  };
  ctx.strokeStyle = M.quai; ctx.lineWidth = 14;
  for (const s of [-1, 1]) { rive(s, 5); ctx.stroke(); }

  edge(); ctx.fillStyle = motif(M.id + '-eau', 2, M.eau); ctx.fill();
  ctx.save();
  edge(); ctx.clip();
  ctx.strokeStyle = motif(M.id + '-bord', 1, 'rgba(62,139,168,.5)'); ctx.lineWidth = 36; ctx.globalAlpha = 0.6;
  for (const s of [-1, 1]) { rive(s, 0); ctx.stroke(); }
  ctx.restore();

  ctx.strokeStyle = encre;
  for (const s of [-1, 1]) {
    ctx.lineWidth = 1.6; rive(s, 0); ctx.stroke();
    ctx.lineWidth = 1; ctx.globalAlpha = 0.7; rive(s, 10); ctx.stroke();
    ctx.lineWidth = 0.9; ctx.globalAlpha = 0.6;
    ctx.beginPath();
    for (let y = Math.floor(yBot / 16) * 16; y <= yTop; y += 16) {
      const x = L.center(y) + s * L.half(y);
      ctx.moveTo(x, Y(y)); ctx.lineTo(x + s * 10, Y(y));
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Ripples drift with the current
  const phase = (t * L.speed * 0.6) % 46;
  ctx.strokeStyle = C.reserve; ctx.lineWidth = 2.2; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  for (let j = Math.floor((yBot - phase) / 46); j * 46 + phase <= yTop; j++) {
    const ry = j * 46 + phase, h = L.half(ry), rx = L.center(ry) + (hash(j) - 0.5) * 1.6 * h;
    ctx.moveTo(rx - 8, Y(ry)); ctx.quadraticCurveTo(rx, Y(ry) - 3, rx + 8, Y(ry));
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Whirlpools: three layers turning at different speeds
  for (const w of L.whirls) {
    const wy = Y(w.y);
    if (wy < -90 || wy > viewH + 90) continue;
    const k = w.r / 56, sens = Math.sign(w.spin);
    spriteM('tourbillon-1', w.x, wy, k, t * sens * 0.7);
    spriteM('tourbillon-2', w.x, wy, k, t * sens * 1.3 + 1);
    spriteM('tourbillon-3', w.x, wy, k, t * sens * 2.2 + 2);
  }

  // Objects
  for (const o of L.objets) {
    if (o.pris) continue;
    const oy = Y(o.y) + Math.sin(t * 2.4 + o.x) * 2;
    if (oy < -40 || oy > viewH + 40) continue;
    if (M.id === 'nuit') {
      // A warm pulse of light, so bonuses can't be missed on dark water
      const r = 38 + Math.sin(t * 4 + o.x) * 4, halo = ctx.createRadialGradient(o.x, oy, 6, o.x, oy, r);
      halo.addColorStop(0, 'rgba(255,226,130,.85)');
      halo.addColorStop(1, 'rgba(255,226,130,0)');
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(o.x, oy, r, 0, TAU); ctx.fill();
    }
    sprite(`${o.k}-${1 + Math.floor(t * 4 + o.x) % 3}`, o.x, oy);
  }

  // The lost page, on the last canal of a world
  if (L.page && !L.page.pris) {
    const hy = Y(L.page.y) + Math.sin(t * 2) * 3;
    if (hy > -40 && hy < viewH + 40 && images['page-perdue']) {
      ctx.save();
      ctx.translate(L.page.x, hy);
      ctx.rotate(Math.sin(t * 1.4) * 0.12);
      ctx.drawImage(images['page-perdue'], -32, -32, 64, 64);
      ctx.restore();
    }
  }

  // Flowers
  for (const f of L.flowers) {
    if (f.got) continue;
    const fy = Y(f.y) + Math.sin(t * 2 + f.x) * 1.5;
    if (fy < -30 || fy > viewH + 30) continue;
    spriteM('fleur', f.x, fy);
  }

  // Rocks: same drawing turned a little so they don't look stamped
  for (const r of L.rocks) {
    const ry = Y(r.y);
    if (ry < -50 || ry > viewH + 50) continue;
    // The rock must show even if the world's sheet is still loading.
    if (images['monde-' + M.id]) spriteM('rocher', r.x, ry, r.r / 21, (hash(Math.round(r.y)) - 0.5) * 1.2);
    else { ctx.fillStyle = '#6e6c78'; ctx.beginPath(); ctx.arc(r.x, ry, r.r, 0, TAU); ctx.fill(); }
  }

  // Ducks
  for (const d of L.ducks) {
    const dy = Y(d.y), x = duckX(d);
    if (dy < -40 || dy > viewH + 40) continue;
    spriteM('mob-' + (1 + Math.floor(t * 3 + d.ph) % 2), x, dy + Math.sin(t * 4 + d.ph) * 0.8, 1, 0, Math.cos(t * d.w + d.ph) < 0);
  }

  // Each boat of the fleet leaves its own trail
  const flotte = images[feuilleBateau()];
  for (const p of parts) if (p.k === 'trace' && flotte) {
    ctx.globalAlpha = p.life / p.max;
    if (p.epique) sprite('sillage-epique-' + p.n, p.x, Y(p.y), 1, p.life * 3);
    else dessin(flotte, ATLAS_FLOTTE['sillage-' + p.n], p.x, Y(p.y), 1, p.life * 3);
    ctx.globalAlpha = 1;
  }

  // Bubbles under the boat
  for (const p of parts) if (p.k === 'bulle') {
    ctx.fillStyle = `rgba(255,253,246,${0.5 * p.life / p.max})`;
    ctx.beginPath(); ctx.arc(p.x, Y(p.y), 2, 0, TAU); ctx.fill();
  }

  drawFantome();
  drawBoat();
  drawArrivee();

  // Effects
  for (const p of parts) {
    const a = p.life / p.max, py = Y(p.y);
    if (p.k === 'vent') {
      ctx.strokeStyle = `rgba(46,58,79,${a * 0.8})`; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(p.x, py); ctx.lineTo(p.x - p.vx * 0.06, py + p.vy * 0.06); ctx.stroke();
    } else if (p.k === 'goutte') {
      ctx.fillStyle = `rgba(255,253,246,${a})`;
      ctx.beginPath(); ctx.arc(p.x, py, 2.6, 0, TAU); ctx.fill();
    } else if (p.k === 'petale') {
      ctx.fillStyle = `rgba(232,87,142,${a})`;
      ctx.beginPath(); ctx.ellipse(p.x, py, 4, 2.6, p.life * 6, 0, TAU); ctx.fill();
    } else if (p.k === 'etincelle') {
      const r = 4.5 * a + 1;
      ctx.fillStyle = `rgba(246,201,69,${a})`;
      ctx.beginPath();
      ctx.moveTo(p.x, py - r); ctx.lineTo(p.x + r * 0.3, py - r * 0.3); ctx.lineTo(p.x + r, py); ctx.lineTo(p.x + r * 0.3, py + r * 0.3);
      ctx.lineTo(p.x, py + r); ctx.lineTo(p.x - r * 0.3, py + r * 0.3); ctx.lineTo(p.x - r, py); ctx.lineTo(p.x - r * 0.3, py - r * 0.3);
      ctx.fill();
    } else if (p.k === 'confetti') {
      ctx.save();
      ctx.translate(p.x, py); ctx.rotate(p.tour + p.life * 7);
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.couleur;
      ctx.fillRect(-3.5, -5, 7, 10);
      ctx.restore();
    } else if (p.k === 'texte') {
      ctx.globalAlpha = Math.min(1, a * 2);
      ctx.font = `${p.taille}px "Caveat Brush", cursive`;
      ctx.textAlign = 'center';
      ctx.fillStyle = C.reserve; ctx.fillText(p.txt, p.x + 1.5, py + 1.5);
      ctx.fillStyle = '#c13a72'; ctx.fillText(p.txt, p.x, py);
      ctx.globalAlpha = 1;
    }
  }
  for (const r of rings) {
    const a = 1 - r.t / 0.5, y = Y(r.y);
    ctx.strokeStyle = r.or ? `rgba(246,201,69,${a})` : `rgba(255,253,246,${a * 0.9})`;
    if (r.choc) { ctx.lineWidth = 7 * a + 1; ctx.beginPath(); ctx.ellipse(r.x, y, 14 + r.t * 170, 9 + r.t * 110, 0, 0, TAU); ctx.stroke(); continue; }
    ctx.lineWidth = 5 * a + 1;
    ctx.beginPath(); ctx.arc(r.x, y, 10 + r.t * 110, 0, TAU); ctx.stroke();
    ctx.lineWidth = 2.5 * a;
    ctx.beginPath(); ctx.arc(r.x, y, 4 + r.t * 60, 0, TAU); ctx.stroke();
  }

  for (const p of prises) {
    const image = 1 + Math.min(3, Math.floor(p.t / 0.075));
    if (p.k === 'rafale') { sprite('rafale-legendaire-' + image, p.x, Y(p.y), 1.5); continue; }
    sprite(p.k === 'burst' ? 'ciree-burst' : `${p.k}-pick-${image}`, p.x, Y(p.y));
  }

  // The season drifting across the screen
  if (!calme && ATLAS_MONDES[M.id]['particule-1']) {
    ctx.globalAlpha = M.id === 'nuit' ? 0.45 : 0.85;
    for (let i = 0; i < 14; i++) {
      const x = xMin + hash(i + 7) * (xMax - xMin) + Math.sin(t * 0.8 + i) * 16;
      const y = (hash(i + 21) * (viewH + 40) + t * (24 + hash(i + 3) * 26)) % (viewH + 40) - 20;
      spriteM('particule-' + (1 + (i + Math.floor(t * 2)) % 3), x, y);
    }
    ctx.globalAlpha = 1;
  }

  // Speed lines during the big sail
  if (boat.boost > 0 && !calme) {
    ctx.strokeStyle = 'rgba(255,253,246,.7)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const x = xMin + hash(i + 40) * (xMax - xMin), y = (hash(i + 90) * viewH + t * 900) % (viewH + 60) - 30;
      ctx.moveTo(x, y); ctx.lineTo(x, y + 34);
    }
    ctx.stroke();
  }

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,253,246,${flash * 2.2})`;
    ctx.fillRect(xMin - 10, -10, xMax - xMin + 20, viewH + 20);
  }

  // The canal's name when a run starts, the world's when one begins, a warning on the last one
  const debutMonde = level % CANAUX_MONDE === 1, finMonde = level % CANAUX_MONDE === 0, duree = debutMonde || finMonde ? 2.6 : 1.6;
  if (state === 'jeu' && t < duree) {
    const titre = finMonde ? T.finale : debutMonde && !essaiMonde ? T.mondes[M.id] : `${T.canal} ${level}`;
    ctx.globalAlpha = clamp((duree - t) * 2, 0, 1);
    ctx.font = `${finMonde ? 34 : 46}px "Caveat Brush", cursive`;
    ctx.textAlign = 'center';
    ctx.fillStyle = C.reserve; ctx.fillText(titre, W / 2 + 2, viewH * 0.3 + 2);
    ctx.fillStyle = '#2e3a4f'; ctx.fillText(titre, W / 2, viewH * 0.3);
    ctx.globalAlpha = 1;
  }
}

// Replays the best run, interpolating between samples taken every 0.1 s.
function drawFantome() {
  if (!fantome || state === 'pret') return;
  const i = Math.min(chrono * 10, fantome.length - 1), a = fantome[Math.floor(i)], b = fantome[Math.ceil(i)];
  const u = i % 1, x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u;
  sprite('boat-ghost', x, Y(y));
}

// The finish is bunting strung high between two masts: the boat sails under it.
function drawArrivee() {
  const py = Y(L.len);
  if (py < -70 || py > viewH + 60) return;
  const c = L.center(L.len), h = L.half(L.len) + 7, gauche = c - h, droite = c + h;
  const hautMat = py - 40, creux = py - 8, corde = u => hautMat + 4 * u * (1 - u) * (creux - hautMat);

  // Its shadow on the water reads as height
  ctx.strokeStyle = 'rgba(46,58,79,.16)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(gauche, hautMat + 42); ctx.quadraticCurveTo(c, 2 * creux - hautMat + 42, droite, hautMat + 42); ctx.stroke();

  ctx.strokeStyle = mondeDe(level).encre; ctx.lineCap = 'round';
  for (const x of [gauche, droite]) {
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, py + 8); ctx.lineTo(x, hautMat - 8); ctx.stroke();
    ctx.fillStyle = C.bois; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(x, py + 8, 8, 4, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(gauche, hautMat); ctx.quadraticCurveTo(c, 2 * creux - hautMat, droite, hautMat); ctx.stroke();

  const n = Math.max(8, Math.floor(h / 13));
  ctx.lineJoin = 'round'; ctx.lineWidth = 1;
  for (let i = 1; i < n; i++) {
    const u = i / n, x = gauche + u * h * 2, y = corde(u), fete = state === 'port';
    const vent = Math.sin(t * (fete ? 14 : 3) + i) * (fete ? 5 : 1.5);
    ctx.fillStyle = FANIONS[i % 4];
    ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y); ctx.lineTo(x + vent, y + 16); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function drawBoat() {
  const b = boat;
  if (b.inv > 0 && state === 'jeu' && Math.floor(b.inv * 10) % 2) return;
  const etat = b.hp >= 3 ? 'sec' : b.hp === 2 ? 'humide' : 'trempe';
  const a = (b.cap % TAU + TAU) % TAU;
  const deFace = Math.min(a, Math.abs(a - Math.PI), TAU - a) < 0.2;
  const vue = deFace ? 'repos' : Math.round(a / (TAU / 16)) % 16;
  const y = Y(b.y) + Math.sin(t * 3) * 0.8;
  const roulis = Math.sin(t * 2) * 0.03;
  // Squashes as a gust hits, and goes down when it sinks.
  const u = b.pop / 0.18, coule = state === 'coule' ? clamp(finT / 1.1, 0, 1) : 0;
  const k = 1.05 * (1 + 0.16 * u) * (1 - coule * 0.45), ky = 1 - 0.22 * u;
  const image = images[feuilleBateau()];
  ctx.globalAlpha = 1 - coule;
  const rarete = rareteChoisie();
  if (rarete === 'rare') sprite('aura-rare', b.x, y, 1.5);
  else if (rarete === 'epique') sprite(`aura-epique-${1 + Math.floor(t * 8) % 4}`, b.x, y, 1.5);
  else if (rarete === 'legendaire') sprite(`aura-legendaire-${1 + Math.floor(t * 10) % 6}`, b.x, y, 1.5);
  if (image && bateauChoisi() !== 'classique') {
    // The fleet has the right-hand headings only: the left side is mirrored.
    const i = Math.round(a / (TAU / 16)) % 16, miroir = i > 4 && i < 12, cap = miroir ? (24 - i) % 16 : i;
    const nom = deFace ? `${etat}-repos` : `${etat}-v${[0, 22, 45, 67, 90, 0, 0, 0, 0, 0, 0, 0, 270, 292, 315, 337][cap]}`;
    dessin(image, ATLAS_FLOTTE[nom], b.x, y + coule * 8, k, roulis + coule * 0.5, miroir, ky);
  } else {
    dessin(image || images['bateau-classique-uni'], ATLAS_BATEAU[`${etat}-${vue}`], b.x, y + coule * 8, k, roulis + coule * 0.5, false, ky);
  }
  ctx.globalAlpha = 1;

  // Active objects around the boat
  const pas = Math.floor(t * 8) % 4 + 1;
  if (b.ciree) sprite('ciree-shield', b.x, y);
  if (b.boost > 0) sprite(`voile-fx-${pas}`, b.x, y, 1, Math.PI / 2 - a);
  if (b.abeille > 0) sprite(`abeille-fx-${pas}`, b.x, y);
}

// Active bonuses under the top bar, each with the time it has left.
function drawBonus() {
  const b = boat, actifs = [];
  if (b.ciree) actifs.push(['ciree', 1]);
  if (b.boost > 0) actifs.push(['voile', b.boost / b.boostMax]);
  if (b.abeille > 0) actifs.push(['abeille', b.abeille / b.abeilleMax]);
  if (b.ralenti > 0) actifs.push(['libellule', b.ralenti / b.ralentiMax]);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const haut = $('hud').getBoundingClientRect();
  actifs.forEach(([k, reste], i) => {
    const x = haut.left + 30 + i * 46, y = haut.bottom + 26;
    sprite('hud-' + k, x, y, 1);
    ctx.lineCap = 'round'; ctx.lineWidth = 3.4;
    ctx.strokeStyle = '#e3d9c3'; ctx.beginPath(); ctx.arc(x, y, 18.5, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#3e8ba8'; ctx.beginPath(); ctx.arc(x, y, 18.5, -Math.PI / 2, -Math.PI / 2 + TAU * reste); ctx.stroke();
  });
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (gel > 0) gel -= dt;
  else if (state !== 'pause') update(dt);
  draw();
  if (state === 'jeu' || state === 'pause') drawBonus();
  requestAnimationFrame(frame);
}

// Poki restores cloud saves during init, so nothing reads the save before that.
function demarrer() {
  start(store.get('niveau', 1));
  const premier = mondeDe(store.get('niveau', 1));
  Promise.all([...['sprites', 'page-perdue', 'bateau-classique-uni', feuilleBateau()].map(charger), chargerMonde(premier)]).then(() => {
    if (SDK) SDK.gameLoadingFinished();
    requestAnimationFrame(frame);
    verifierCompte();
    if (RELIRE) relireHistoire();
    else if (ESSAI) lancerEssai();
    else if (!store.get('introVue')) raconter(H.intro, IMAGES_INTRO, () => store.set('introVue', true));
    MONDES.forEach(chargerMonde);          // the rest quietly, so the next world is ready
  });
}

if (SDK) SDK.init().then(demarrer).catch(demarrer);
else demarrer();
</script>
